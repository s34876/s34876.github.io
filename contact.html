<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลติดต่อ</title>
    <style>
        /* ตั้งค่าพื้นหลังเว็บเป็นสีฟ้าอ่อน */
        body {
            background-color: #e0f2fe; /* สีฟ้าอ่อน */
            font-family: 'sans-serif', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #000000; /* ตัวหนังสือหลักสีดำ */
        }

        /* กล่องเนื้อหาสีขาว */
        .card {
            background-color: #ffffff; /* กล่องสีขาว */
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: left;
        }

        /* หัวข้อเน้นเด่นชัด สีชมพูอ่อน */
        h1 {
            color: #f472b6; /* สีชมพูอ่อนเด่นชัด */
            text-align: center;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 32px;
            font-weight: bold;
        }

        /* รายการข้อมูลติดต่อ */
        .contact-item {
            margin-bottom: 16px;
            font-size: 18px;
            line-height: 1.6;
        }

        /* หัวข้อข้อมูลติดต่อเป็นตัวเข้ม */
        .label {
            font-weight: bold;
        }

        /* รายละเอียดเป็นตัวบาง */
        .value {
            font-weight: 300;
        }

        /* ปุ่มกลับหน้าแรก */
        .btn-container {
            text-align: center;
            margin-top: 30px;
        }

        .home-btn {
            display: inline-block;
            background-color: #f472b6; /* สีชมพูอ่อนเดียวกับหัวข้อ */
            color: #ffffff;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .home-btn:hover {
            background-color: #ec4899; /* เข้มขึ้นเล็กน้อยเมื่อเอาเมาส์ชี้ */
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>ข้อมูลติดต่อ</h1>
        
        <div class="contact-item">
            <span class="label">เบอร์โทรศัพท์ :</span> 
            <span class="value">0983416418</span>
        </div>

        <div class="contact-item">
            <span class="label">Gmail :</span> 
            <span class="value">m0983416418@gmail.com</span>
        </div>

        <div class="contact-item">
            <span class="label">Facebook :</span> 
            <span class="value">Panchanit Boonsri</span>
        </div>

        <div class="contact-item">
            <span class="label">Instagram :</span> 
            <span class="value">p4naem._</span>
        </div>

        <!-- ปุ่มสำหรับกดกลับหน้าแรก -->
        <div class="btn-container">
            <a href="index.html" class="home-btn">กลับหน้าแรก</a>
        </div>
    </div>

</body>
</html>
